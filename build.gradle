plugins {
    // 26.x 线用原生 loom（无 -remap 后缀）：26.1 起 Minecraft 不再混淆，无需 remap
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name 'terraformersmc Maven'
        url "https://maven.terraformersmc.com"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.x 线依赖走 implementation（1.x 时代才是 mod 依赖配置）；26.x 无混淆，无 mappings 行
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Mod Menu（可选软依赖，仅编译期）
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// 目标 Java 版本走 toolchain 声明（缺 JDK 时由 settings.gradle 的 foojay 自动 provision）
def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

base {
    archivesName = project.archives_base_name
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

test {
    useJUnitPlatform()
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
