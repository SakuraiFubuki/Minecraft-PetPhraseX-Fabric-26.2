pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// foojay：缺 JDK 时让 build.gradle 的 java.toolchain 能自动 provision（26.x 线目标 Java 25）
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
